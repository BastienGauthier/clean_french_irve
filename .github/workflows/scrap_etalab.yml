name: scrap-etalab

on:
  workflow_dispatch: # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#workflow_dispatch

  schedule: # https://docs.github.com/en/actions/using-workflows/events-that-trigger-workflows#schedule
    - cron:  '00 5 * * *'  # every day at 05:00 UTC

env:
  PYTHON_VERSION: '3.15'

jobs:
  scrap-etalab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Verify uv.lock agrees with pyproject.toml
        run: uv lock --check
      - name: Install dependencies
        run: uv sync --frozen --no-install-project
      - name: RunScrappingScript
        run: uv run python app/clean_irve_data.py
      - name: RunCombinedScript
        run: uv run python app/combined_irve_data.py
      - name: CompleteFollowUp
        run: uv run python app/complete_irve_data_followup.py
      - name: AnalyseIrveData
        run: uv run python app/analyse_irve_data.py
      - name: Push data to the repo
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git status
          git add .
          git commit -m "ci (update data): etalab"
          git push origin main --force
